<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get File / Channel Link</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 14px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }
        h2 { font-size: 22px; margin-bottom: 10px; color: #38bdf8; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
        .btn {
            display: block;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Unlock Your Link</h2>
        <p>Complete the verification to access the Telegram channel or file.</p>
        <a href="/download" class="btn">Click Here to Unlock Link</a>
    </div>
</body>
</html>
